<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 320" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
    <defs>
        <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFDF0"/>
            <stop offset="25%" stop-color="#FDE68A"/>
            <stop offset="60%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>

        <linearGradient id="blueH" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>

        <linearGradient id="darkBgH" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#061226"/>
            <stop offset="50%" stop-color="#0A192F"/>
            <stop offset="100%" stop-color="#040A17"/>
        </linearGradient>

        <filter id="glowH" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="shadowH" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
        </filter>
    </defs>

    <!-- Background card -->
    <rect width="1350" height="320" rx="24" fill="url(#darkBgH)"/>
    <rect x="2" y="2" width="1346" height="316" rx="22" fill="none" stroke="url(#goldH)" stroke-width="1" opacity="0.3"/>

    <!-- Left Emblem Assembly ("H" Gateway + EuroPath Highway + 12 EU Stars) -->
    <g id="emblemLeft" filter="url(#shadowH)">
        <!-- Circular Star Ring -->
        <circle cx="160" cy="160" r="115" fill="none" stroke="url(#goldH)" stroke-width="1.5" opacity="0.35"/>
        <g id="stars"><polygon points="160.00,37.00 161.80,42.53 167.61,42.53 162.91,45.94 164.70,51.47 160.00,48.06 155.30,51.47 157.09,45.94 152.39,42.53 158.20,42.53" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="217.50,54.91 218.73,58.71 222.73,58.71 219.50,61.06 220.73,64.86 217.50,62.51 214.27,64.86 215.50,61.06 212.27,58.71 216.27,58.71" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="259.59,97.00 260.83,100.80 264.82,100.80 261.59,103.15 262.83,106.95 259.59,104.60 256.36,106.95 257.59,103.15 254.36,100.80 258.36,100.80" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="275.00,154.50 276.23,158.30 280.23,158.30 277.00,160.65 278.23,164.45 275.00,162.10 271.77,164.45 273.00,160.65 269.77,158.30 273.77,158.30" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="259.59,212.00 260.83,215.80 264.82,215.80 261.59,218.15 262.83,221.95 259.59,219.60 256.36,221.95 257.59,218.15 254.36,215.80 258.36,215.80" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="217.50,254.09 218.73,257.89 222.73,257.89 219.50,260.24 220.73,264.04 217.50,261.69 214.27,264.04 215.50,260.24 212.27,257.89 216.27,257.89" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="160.00,269.50 161.23,273.30 165.23,273.30 162.00,275.65 163.23,279.45 160.00,277.10 156.77,279.45 158.00,275.65 154.77,273.30 158.77,273.30" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="102.50,254.09 103.73,257.89 107.73,257.89 104.50,260.24 105.73,264.04 102.50,261.69 99.27,264.04 100.50,260.24 97.27,257.89 101.27,257.89" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="60.41,212.00 61.64,215.80 65.64,215.80 62.41,218.15 63.64,221.95 60.41,219.60 57.17,221.95 58.41,218.15 55.18,215.80 59.17,215.80" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="45.00,154.50 46.23,158.30 50.23,158.30 47.00,160.65 48.23,164.45 45.00,162.10 41.77,164.45 43.00,160.65 39.77,158.30 43.77,158.30" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="60.41,97.00 61.64,100.80 65.64,100.80 62.41,103.15 63.64,106.95 60.41,104.60 57.17,106.95 58.41,103.15 55.18,100.80 59.17,100.80" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="102.50,54.91 103.73,58.71 107.73,58.71 104.50,61.06 105.73,64.86 102.50,62.51 99.27,64.86 100.50,61.06 97.27,58.71 101.27,58.71" fill="url(#goldH)" filter="url(#glowH)"/></g>

        <!-- Ascending 3D Highway -->
        <polygon points="90,250 230,250 185,135 135,135" fill="url(#blueH)" stroke="#1E40AF" stroke-width="1"/>
        <line x1="90" y1="250" x2="135" y2="135" stroke="url(#goldH)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="230" y1="250" x2="185" y2="135" stroke="url(#goldH)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="160" y1="250" x2="160" y2="135" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 8"/>

        <!-- Left Column of H -->
        <polygon points="100,75 118,60 118,245 100,260" fill="#0C1B35" stroke="#1E3A8A" stroke-width="1"/>
        <polygon points="118,60 138,60 138,245 118,245" fill="url(#goldH)"/>
        <line x1="138" y1="60" x2="138" y2="245" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>

        <!-- Right Column of H -->
        <polygon points="182,60 202,60 202,245 182,245" fill="url(#goldH)"/>
        <polygon points="202,60 220,75 220,260 202,245" fill="#0C1B35" stroke="#1E3A8A" stroke-width="1"/>
        <line x1="182" y1="60" x2="182" y2="245" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>

        <!-- Arch / Crossbeam of H -->
        <path d="M 138 125 C 145 118 175 118 182 125 L 182 148 C 175 142 145 142 138 148 Z" fill="url(#goldH)"/>

        <!-- North Star Beacon -->
        <g transform="translate(160, 42)">
            <polygon points="0,-18 3,-3 18,0 3,3 0,18 -3,3 -18,0 -3,-3" fill="url(#goldH)" filter="url(#glowH)"/>
            <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
        </g>
    </g>

    <!-- Right Brand Typography -->
    <g transform="translate(320, 130)">
        <!-- Primary Brand Name: HARRY OVERSEAS -->
        <text y="0" font-family="'Montserrat', 'Outfit', 'Inter', system-ui, sans-serif" font-size="76" font-weight="900" letter-spacing="4">
            <tspan fill="#FFFFFF">HARRY </tspan><tspan fill="url(#goldH)">OVERSEAS</tspan>
        </text>

        <!-- Divider Line with Diamond -->
        <line x1="5" y1="24" x2="820" y2="24" stroke="url(#goldH)" stroke-width="1.8" opacity="0.6"/>
        <polygon points="410,20 414,24 410,28 406,24" fill="#F59E0B"/>

        <!-- Subtitle: IMMIGRATION & LANGUAGE -->
        <text y="56" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="800" fill="#38BDF8" letter-spacing="10">
            IMMIGRATION &amp; LANGUAGE
        </text>

        <!-- Tagline: THE EUROPATH GATEWAY TO EUROPE -->
        <text y="78" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="5">
            EUROPATH GATEWAY • GERMANY &amp; SCHENGEN MOBILITY
        </text>

        <!-- Key Services Pills -->
        <g transform="translate(5, 102)">
            <rect x="0" y="0" width="135" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
            <text x="67" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">GERMANY VISAS</text>

            <rect x="150" y="0" width="135" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
            <text x="217" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">CHANCENKARTE</text>

            <rect x="300" y="0" width="135" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
            <text x="367" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">GERMAN A1–B2</text>

            <rect x="450" y="0" width="135" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
            <text x="517" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">STUDY &amp; WORK</text>

            <rect x="600" y="0" width="155" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
            <text x="677" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">ARRIVAL SUPPORT</text>
        </g>
    </g>
</svg>