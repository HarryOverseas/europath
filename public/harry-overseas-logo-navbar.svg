<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
    <defs>
        <linearGradient id="goldNav" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFDF0"/>
            <stop offset="30%" stop-color="#FDE68A"/>
            <stop offset="70%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>
        <linearGradient id="blueNav" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#1E40AF"/>
        </linearGradient>
    </defs>

    <!-- Left Gateway H Mark (50, 50) -->
    <g transform="translate(10, 8)">
        <circle cx="42" cy="42" r="38" fill="#0A192F" stroke="url(#goldNav)" stroke-width="1.5"/>
        <!-- 12 Star dots -->
        <g stroke="none" fill="url(#goldNav)">
            <circle cx="42" cy="8" r="2.5"/>
            <circle cx="59" cy="13" r="1.8"/>
            <circle cx="71" cy="25" r="1.8"/>
            <circle cx="76" cy="42" r="1.8"/>
            <circle cx="71" cy="59" r="1.8"/>
            <circle cx="59" cy="71" r="1.8"/>
            <circle cx="42" cy="76" r="1.8"/>
            <circle cx="25" cy="71" r="1.8"/>
            <circle cx="13" cy="59" r="1.8"/>
            <circle cx="8" cy="42" r="1.8"/>
            <circle cx="13" cy="25" r="1.8"/>
            <circle cx="25" cy="13" r="1.8"/>
        </g>
        <!-- Highway road -->
        <polygon points="26,65 58,65 48,34 36,34" fill="url(#blueNav)"/>
        <line x1="42" y1="65" x2="42" y2="34" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 3"/>

        <!-- Columns of H -->
        <rect x="28" y="18" width="8" height="48" rx="1.5" fill="url(#goldNav)"/>
        <rect x="48" y="18" width="8" height="48" rx="1.5" fill="url(#goldNav)"/>
        <!-- Arch of H -->
        <rect x="36" y="34" width="12" height="7" rx="1" fill="url(#goldNav)"/>
        <!-- Apex Beacon -->
        <polygon points="42,10 43.5,14 47,15 43.5,16 42,20 40.5,16 37,15 40.5,14" fill="#FFFFFF"/>
    </g>

    <!-- Typography -->
    <g transform="translate(110, 48)">
        <text y="0" font-family="'Montserrat', system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5">
            <tspan fill="#FFFFFF">HARRY </tspan><tspan fill="url(#goldNav)">OVERSEAS</tspan>
        </text>
        <text y="24" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="3.5">
            IMMIGRATION &amp; LANGUAGE
        </text>
        <text y="38" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8" letter-spacing="2">
            EUROPATH GATEWAY • GERMANY
        </text>
    </g>
</svg>