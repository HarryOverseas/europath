<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
    <defs>
        <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFDF0"/>
            <stop offset="25%" stop-color="#FDE68A"/>
            <stop offset="60%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>

        <linearGradient id="blueH" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>

        <linearGradient id="darkBgH" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#061226"/>
            <stop offset="50%" stop-color="#0A192F"/>
            <stop offset="100%" stop-color="#040A17"/>
        </linearGradient>

        <filter id="glowH" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="shadowH" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
        </filter>
    </defs>

    <!-- Background card -->
    <rect width="1200" height="320" rx="24" fill="url(#darkBgH)"/>
    <rect x="2" y="2" width="1196" height="316" rx="22" fill="none" stroke="url(#goldH)" stroke-width="1" opacity="0.3"/>

    <!-- Left Emblem Assembly -->
    <g id="emblemLeft" filter="url(#shadowH)">
        <!-- Circular Star Ring -->
        <circle cx="160" cy="160" r="115" fill="none" stroke="url(#goldH)" stroke-width="1.5" opacity="0.35"/>
        <g id="stars"><polygon points="160.00,37.00 161.80,42.53 167.61,42.53 162.91,45.94 164.70,51.47 160.00,48.06 155.30,51.47 157.09,45.94 152.39,42.53 158.20,42.53" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="217.50,54.91 218.73,58.71 222.73,58.71 219.50,61.06 220.73,64.86 217.50,62.51 214.27,64.86 215.50,61.06 212.27,58.71 216.27,58.71" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="259.59,97.00 260.83,100.80 264.82,100.80 261.59,103.15 262.83,106.95 259.59,104.60 256.36,106.95 257.59,103.15 254.36,100.80 258.36,100.80" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="275.00,154.50 276.23,158.30 280.23,158.30 277.00,160.65 278.23,164.45 275.00,162.10 271.77,164.45 273.00,160.65 269.77,158.30 273.77,158.30" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="259.59,212.00 260.83,215.80 264.82,215.80 261.59,218.15 262.83,221.95 259.59,219.60 256.36,221.95 257.59,218.15 254.36,215.80 258.36,215.80" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="217.50,254.09 218.73,257.89 222.73,257.89 219.50,260.24 220.73,264.04 217.50,261.69 214.27,264.04 215.50,260.24 212.27,257.89 216.27,257.89" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="160.00,269.50 161.23,273.30 165.23,273.30 162.00,275.65 163.23,279.45 160.00,277.10 156.77,279.45 158.00,275.65 154.77,273.30 158.77,273.30" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="102.50,254.09 103.73,257.89 107.73,257.89 104.50,260.24 105.73,264.04 102.50,261.69 99.27,264.04 100.50,260.24 97.27,257.89 101.27,257.89" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="60.41,212.00 61.64,215.80 65.64,215.80 62.41,218.15 63.64,221.95 60.41,219.60 57.17,221.95 58.41,218.15 55.18,215.80 59.17,215.80" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="45.00,154.50 46.23,158.30 50.23,158.30 47.00,160.65 48.23,164.45 45.00,162.10 41.77,164.45 43.00,160.65 39.77,158.30 43.77,158.30" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="60.41,97.00 61.64,100.80 65.64,100.80 62.41,103.15 63.64,106.95 60.41,104.60 57.17,106.95 58.41,103.15 55.18,100.80 59.17,100.80" fill="url(#goldH)" filter="url(#glowH)"/>
<polygon points="102.50,54.91 103.73,58.71 107.73,58.71 104.50,61.06 105.73,64.86 102.50,62.51 99.27,64.86 100.50,61.06 97.27,58.71 101.27,58.71" fill="url(#goldH)" filter="url(#glowH)"/></g>

        <!-- Monogram Backbone (Vertical Spine) -->
        <polygon points="110,65 128,50 128,245 110,260" fill="#0C1B35" stroke="#1E3A8A" stroke-width="1"/>
        <polygon points="128,50 148,50 148,245 128,245" fill="url(#goldH)"/>
        <line x1="148" y1="50" x2="148" y2="245" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>

        <!-- Sweeping Highway (The Path) -->
        <path d="M 235 240 
                 C 205 265 155 270 120 255 
                 C 90 240 75 210 75 180 
                 C 75 145 100 115 135 97 
                 L 135 115 
                 C 110 130 95 150 95 180 
                 C 95 200 105 220 125 232 
                 C 155 246 195 242 225 222 Z"
              fill="url(#blueH)" stroke="#1E40AF" stroke-width="1"/>
        <path d="M 235 240 C 205 265 155 270 120 255 C 90 240 75 210 75 180 C 75 145 100 115 135 97" 
              fill="none" stroke="url(#goldH)" stroke-width="2.5" stroke-linecap="round"/>

        <!-- The "P" Loop (True Proportion: y=50 to y=150) -->
        <path d="M 148 50 
                 C 190 50 225 58 225 100 
                 C 225 142 190 150 148 150 
                 L 148 130 
                 C 178 130 205 124 205 100 
                 C 205 76 178 70 148 70 Z"
              fill="url(#goldH)"/>

        <!-- Middle Bar of E -->
        <polygon points="148,140 210,140 222,150 210,160 148,160" fill="url(#goldH)"/>

        <!-- Bottom Bar of E -->
        <polygon points="148,225 215,225 227,235 215,245 128,245 128,225" fill="url(#goldH)"/>

        <!-- North Star Beacon -->
        <g transform="translate(160, 42)">
            <polygon points="0,-18 3,-3 18,0 3,3 0,18 -3,3 -18,0 -3,-3" fill="url(#goldH)" filter="url(#glowH)"/>
            <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
        </g>
    </g>

    <!-- Right Brand Typography -->
    <g transform="translate(320, 140)">
        <!-- EuroPath Main Wordmark -->
        <text y="0" font-family="'Montserrat', 'Outfit', 'Inter', system-ui, sans-serif" font-size="82" font-weight="900" letter-spacing="6">
            <tspan fill="#FFFFFF">EURO</tspan><tspan fill="url(#goldH)">PATH</tspan>
        </text>

        <!-- Divider Line with Diamond -->
        <line x1="5" y1="26" x2="680" y2="26" stroke="url(#goldH)" stroke-width="1.8" opacity="0.6"/>
        <polygon points="340,22 344,26 340,30 336,26" fill="#F59E0B"/>

        <!-- Subtitle: Category & Promise -->
        <text y="58" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="14">
            GATEWAY TO EUROPE
        </text>

        <!-- Key Services Pills / Trust Indicators -->
        <g transform="translate(5, 82)">
            <rect x="0" y="0" width="130" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
            <text x="65" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">IMMIGRATION</text>

            <rect x="145" y="0" width="130" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
            <text x="210" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">CHANCENKARTE</text>

            <rect x="290" y="0" width="125" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
            <text x="352" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">STUDY &amp; WORK</text>

            <rect x="430" y="0" width="115" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
            <text x="487" y="17" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">GERMAN A1-B2</text>
        </g>
    </g>
</svg>