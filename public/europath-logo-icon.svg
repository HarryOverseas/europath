<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision">
    <defs>
        <radialGradient id="iconBg" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#0E2145"/>
            <stop offset="50%" stop-color="#081428"/>
            <stop offset="100%" stop-color="#020612"/>
        </radialGradient>

        <linearGradient id="goldClean" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFDF0"/>
            <stop offset="25%" stop-color="#FDE68A"/>
            <stop offset="60%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>

        <linearGradient id="blueClean" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00F2FE"/>
            <stop offset="60%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1E3A8A"/>
        </linearGradient>

        <filter id="shadowIcon" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="-2" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
        </filter>
    </defs>

    <rect width="512" height="512" rx="112" fill="url(#iconBg)"/>

    <!-- 12 EU Stars Ring -->
    <g id="stars"><polygon points="256.00,34.00 258.69,42.29 267.41,42.29 260.36,47.42 263.05,55.71 256.00,50.58 248.95,55.71 251.64,47.42 244.59,42.29 253.31,42.29" fill="url(#goldClean)"/>
<polygon points="361.00,66.63 362.68,71.82 368.13,71.82 363.72,75.02 365.41,80.20 361.00,77.00 356.59,80.20 358.28,75.02 353.87,71.82 359.32,71.82" fill="url(#goldClean)"/>
<polygon points="437.87,143.50 439.55,148.68 445.00,148.68 440.59,151.89 442.27,157.07 437.87,153.87 433.46,157.07 435.14,151.89 430.73,148.68 436.18,148.68" fill="url(#goldClean)"/>
<polygon points="466.00,248.50 467.68,253.68 473.13,253.68 468.72,256.89 470.41,262.07 466.00,258.87 461.59,262.07 463.28,256.89 458.87,253.68 464.32,253.68" fill="url(#goldClean)"/>
<polygon points="437.87,353.50 439.55,358.68 445.00,358.68 440.59,361.89 442.27,367.07 437.87,363.87 433.46,367.07 435.14,361.89 430.73,358.68 436.18,358.68" fill="url(#goldClean)"/>
<polygon points="361.00,430.37 362.68,435.55 368.13,435.55 363.72,438.75 365.41,443.93 361.00,440.73 356.59,443.93 358.28,438.75 353.87,435.55 359.32,435.55" fill="url(#goldClean)"/>
<polygon points="256.00,458.50 257.68,463.68 263.13,463.68 258.72,466.89 260.41,472.07 256.00,468.87 251.59,472.07 253.28,466.89 248.87,463.68 254.32,463.68" fill="url(#goldClean)"/>
<polygon points="151.00,430.37 152.68,435.55 158.13,435.55 153.72,438.75 155.41,443.93 151.00,440.73 146.59,443.93 148.28,438.75 143.87,435.55 149.32,435.55" fill="url(#goldClean)"/>
<polygon points="74.13,353.50 75.82,358.68 81.27,358.68 76.86,361.89 78.54,367.07 74.13,363.87 69.73,367.07 71.41,361.89 67.00,358.68 72.45,358.68" fill="url(#goldClean)"/>
<polygon points="46.00,248.50 47.68,253.68 53.13,253.68 48.72,256.89 50.41,262.07 46.00,258.87 41.59,262.07 43.28,256.89 38.87,253.68 44.32,253.68" fill="url(#goldClean)"/>
<polygon points="74.13,143.50 75.82,148.68 81.27,148.68 76.86,151.89 78.54,157.07 74.13,153.86 69.73,157.07 71.41,151.89 67.00,148.68 72.45,148.68" fill="url(#goldClean)"/>
<polygon points="151.00,66.63 152.68,71.82 158.13,71.82 153.72,75.02 155.41,80.20 151.00,77.00 146.59,80.20 148.28,75.02 143.87,71.82 149.32,71.82" fill="url(#goldClean)"/></g>

    <!-- Monogram Assembly -->
    <g id="monogram" filter="url(#shadowIcon)" transform="translate(14, 0)">
        <!-- Vertical Spine -->
        <polygon points="160,110 195,85 195,390 160,420" fill="#0C1B35" stroke="#1E3A8A" stroke-width="1"/>
        <polygon points="195,85 230,85 230,390 195,390" fill="url(#goldClean)"/>
        <line x1="230" y1="85" x2="230" y2="390" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

        <!-- Sweeping Highway (Bottom of E & The Path) -->
        <path d="M 370 380 
                 C 320 425 250 435 195 405 
                 C 145 380 120 330 120 280 
                 C 120 220 160 170 215 140 
                 L 215 170 
                 C 175 192 155 228 155 275 
                 C 155 310 172 342 205 362 
                 C 250 385 310 380 350 345 Z"
              fill="url(#blueClean)" stroke="#1E40AF" stroke-width="1.5"/>

        <!-- Upper P Loop (True P: y=85 to y=240) -->
        <path d="M 230 85 
                 C 300 85 355 95 355 162 
                 C 355 230 300 240 230 240 
                 L 230 205 
                 C 280 205 320 198 320 162 
                 C 320 126 280 120 230 120 Z"
              fill="url(#goldClean)"/>

        <!-- Middle Bar of E -->
        <polygon points="230,225 330,225 348,242 330,260 230,260" fill="url(#goldClean)"/>

        <!-- Bottom Bar of E -->
        <polygon points="230,350 330,350 348,368 330,385 195,385 195,350" fill="url(#goldClean)"/>

        <!-- Beacon Star at Apex -->
        <g transform="translate(242, 60)">
            <polygon points="0,-24 4,-4 24,0 4,4 0,24 -4,4 -24,0 -4,-4" fill="url(#goldClean)"/>
            <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
        </g>
    </g>

    <!-- Luxury border ring -->
    <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldClean)" stroke-width="1.5" opacity="0.3"/>
</svg>