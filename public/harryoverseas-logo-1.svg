<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">HarryOverseas</title>
  <desc id="desc">HarryOverseas global education and immigration logo with graduation cap, globe and flight trail.</desc>
  <defs>
    <linearGradient id="swoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B51B"/>
      <stop offset=".52" stop-color="#E52B32"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67D5F5"/>
      <stop offset="1" stop-color="#1556A8"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(24 34)">
    <path d="M20 168 C78 90 151 58 226 39" fill="none" stroke="url(#swoosh)" stroke-width="13" stroke-linecap="round"/>
    <path d="M20 168 C83 112 145 93 207 80" fill="none" stroke="#E52B32" stroke-width="4" stroke-linecap="round"/>
    <!-- graduation cap -->
    <path d="M42 52 L127 17 L212 52 L127 87 Z" fill="#102C59"/>
    <path d="M75 68 V105 C105 124 149 124 179 105 V68" fill="#163D75"/>
    <path d="M212 52 V91" stroke="#E7A91B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="212" cy="94" r="5" fill="#E7A91B"/>
    <!-- globe -->
    <circle cx="126" cy="164" r="47" fill="url(#globe)" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M95 135 C110 126 120 135 125 145 C133 150 132 161 144 164 C151 168 149 178 140 184 C133 190 135 199 127 207
             M83 158 C98 155 104 164 111 171 C115 178 108 188 99 190
             M148 124 C143 136 153 143 164 145
             M157 180 C147 184 151 194 144 201" fill="none" stroke="#EAF8FF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="278" y="165" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="800" letter-spacing="-4">
    <tspan fill="#102C59">Harry</tspan><tspan fill="#D92332">Overseas</tspan>
  </text>
  <path d="M285 190 H950" stroke="#D7A322" stroke-width="3"/>
  <text x="290" y="230" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="5" fill="#102C59">STUDY  •  WORK  •  SETTLE</text>
  <text x="290" y="270" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" letter-spacing="1.2" fill="#5B6472">Your Global Education Partner</text>
</svg>